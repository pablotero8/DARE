<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coach | DARE</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tulpen+One&family=Manrope:wght@300;400;600;700&display=swap">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#050507;--border:rgba(244,241,232,.10);--border2:rgba(244,241,232,.18);
  --text:#f4f1e8;--muted:rgba(244,241,232,.55);--muted2:rgba(244,241,232,.32);
  --gold:#c9a24a;--gold-dim:rgba(201,162,74,.16);
  --green:#a6c85e;--green-dim:rgba(166,200,94,.15);
  --shadow:0 24px 60px rgba(0,0,0,.6);--r:14px;
}
html,body{height:100%;overflow:hidden}
body{
  background:var(--bg);color:var(--text);
  font-family:'Manrope',system-ui,sans-serif;
  display:flex;flex-direction:column;
}
h1,h2,h3{font-family:'Tulpen One',serif;letter-spacing:.07em}

/* ── HEADER ── */
.header{
  display:flex;align-items:center;justify-content:space-between;
  padding:.75rem 1.5rem;border-bottom:1px solid var(--border);
  background:rgba(5,5,7,.9);backdrop-filter:blur(18px);flex-shrink:0;
}
.header-logo{font-family:'Tulpen One',serif;font-size:1.8rem;letter-spacing:.12em;color:var(--text)}
.header-right{display:flex;align-items:center;gap:.75rem}
.coach-badge{
  display:flex;align-items:center;gap:.5rem;
  background:rgba(255,255,255,.05);border:1px solid var(--border2);
  border-radius:999px;padding:.35rem .75rem .35rem .45rem;
}
.coach-avatar{
  width:28px;height:28px;border-radius:50%;
  background:linear-gradient(135deg,rgba(201,162,74,.5),rgba(166,200,94,.4));
  display:flex;align-items:center;justify-content:center;
  font-size:.62rem;font-weight:700;color:var(--gold);flex-shrink:0;
}
.coach-name{font-size:.72rem;font-weight:600;color:var(--text)}
.coach-role{font-size:.62rem;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.logout-btn{
  background:none;border:1px solid var(--border2);border-radius:8px;
  padding:.35rem .7rem;color:var(--muted);font-size:.72rem;cursor:pointer;
  font-family:'Manrope',sans-serif;transition:border-color .2s,color .2s;
}
.logout-btn:hover{border-color:rgba(244,241,232,.35);color:var(--text)}

/* ── LAYOUT ── */
.layout{display:flex;flex:1;overflow:hidden}

/* ── SIDEBAR ── */
.sidebar{
  width:260px;flex-shrink:0;border-right:1px solid var(--border);
  display:flex;flex-direction:column;background:rgba(5,5,7,.6);
}
.sidebar-head{
  padding:1rem 1rem .6rem;border-bottom:1px solid var(--border);
}
.sidebar-title{font-size:.65rem;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin-bottom:.6rem}
.sidebar-search{
  width:100%;background:rgba(255,255,255,.05);border:1px solid var(--border);
  border-radius:8px;padding:.5rem .75rem;color:var(--text);
  font-family:'Manrope',sans-serif;font-size:.8rem;outline:none;
  transition:border-color .2s;
}
.sidebar-search:focus{border-color:rgba(201,162,74,.4)}
.sidebar-search::placeholder{color:var(--muted2)}

.client-list{flex:1;overflow-y:auto;padding:.5rem 0;scrollbar-width:thin;scrollbar-color:var(--border) transparent}
.client-item{
  display:flex;align-items:center;gap:.6rem;padding:.6rem 1rem;cursor:pointer;
  transition:background .15s;border-left:2px solid transparent;
}
.client-item:hover{background:rgba(255,255,255,.04)}
.client-item.active{background:rgba(201,162,74,.07);border-left-color:var(--gold)}
.ci-avatar{
  width:32px;height:32px;border-radius:50%;flex-shrink:0;
  background:linear-gradient(135deg,rgba(201,162,74,.25),rgba(166,200,94,.2));
  border:1px solid var(--border2);display:flex;align-items:center;
  justify-content:center;font-size:.65rem;font-weight:700;color:var(--muted);
}
.ci-info{flex:1;min-width:0}
.ci-name{font-size:.8rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ci-sub{font-size:.67rem;color:var(--muted);margin-top:.1rem}

.sidebar-footer{padding:.75rem 1rem;border-top:1px solid var(--border)}
.new-client-btn{
  width:100%;padding:.6rem;border:1px dashed rgba(166,200,94,.3);
  border-radius:10px;background:none;color:var(--green);
  font-family:'Manrope',sans-serif;font-size:.75rem;font-weight:600;
  cursor:pointer;transition:background .2s,border-color .2s;
  display:flex;align-items:center;justify-content:center;gap:.4rem;
}
.new-client-btn:hover{background:rgba(166,200,94,.06);border-color:rgba(166,200,94,.5)}

/* ── CHAT ── */
.chat-area{display:flex;flex-direction:column;flex:1;overflow:hidden;position:relative}

.chat-context{
  display:none;align-items:center;gap:.6rem;
  padding:.6rem 1.25rem;border-bottom:1px solid var(--border);
  background:rgba(5,5,7,.5);flex-shrink:0;
}
.chat-context.visible{display:flex}
.ctx-avatar{
  width:26px;height:26px;border-radius:50%;
  background:linear-gradient(135deg,rgba(201,162,74,.3),rgba(166,200,94,.25));
  display:flex;align-items:center;justify-content:center;
  font-size:.6rem;font-weight:700;color:var(--gold);
}
.ctx-label{font-size:.75rem;color:var(--muted)}
.ctx-name{font-weight:700;color:var(--text)}
.ctx-clear{margin-left:auto;background:none;border:none;color:var(--muted2);cursor:pointer;font-size:.8rem;padding:.2rem}
.ctx-clear:hover{color:var(--text)}

.messages{flex:1;overflow-y:auto;padding:1.25rem;display:flex;flex-direction:column;gap:1rem;scrollbar-width:thin;scrollbar-color:var(--border) transparent}

.welcome{
  text-align:center;margin:auto;max-width:360px;padding:2rem 1rem;
}
.welcome h2{font-size:2.2rem;color:var(--gold);margin-bottom:.5rem}
.welcome p{font-size:.85rem;color:var(--muted);line-height:1.6}

/* bubbles */
.msg{display:flex;gap:.6rem;max-width:78%}
.msg.user{align-self:flex-end;flex-direction:row-reverse}
.msg.assistant{align-self:flex-start}
.msg-avatar{
  width:28px;height:28px;border-radius:50%;flex-shrink:0;
  background:linear-gradient(135deg,rgba(201,162,74,.35),rgba(166,200,94,.28));
  display:flex;align-items:center;justify-content:center;font-size:.6rem;font-weight:700;color:var(--gold);
  margin-top:.1rem;
}
.msg.user .msg-avatar{background:rgba(201,162,74,.2)}
.bubble{
  padding:.75rem 1rem;border-radius:var(--r);font-size:.83rem;line-height:1.6;
}
.msg.assistant .bubble{
  background:linear-gradient(160deg,rgba(255,255,255,.07),rgba(255,255,255,.03));
  border:1px solid var(--border);
}
.msg.user .bubble{
  background:linear-gradient(135deg,rgba(201,162,74,.18),rgba(201,162,74,.1));
  border:1px solid rgba(201,162,74,.25);
}

/* action cards */
.action-card{
  margin-top:.6rem;padding:1rem 1.1rem;border-radius:12px;
  background:rgba(166,200,94,.06);border:1px solid rgba(166,200,94,.22);
}
.action-card.gold{background:rgba(201,162,74,.07);border-color:rgba(201,162,74,.25)}
.ac-head{display:flex;align-items:center;gap:.5rem;margin-bottom:.6rem}
.ac-icon{font-size:1rem}
.ac-title{font-size:.8rem;font-weight:700;color:var(--green)}
.action-card.gold .ac-title{color:var(--gold)}
.ac-row{font-size:.75rem;color:var(--muted);margin:.15rem 0}
.ac-row strong{color:var(--text);font-weight:600}
.ac-pwd{
  margin-top:.6rem;background:rgba(0,0,0,.3);border-radius:8px;
  padding:.5rem .75rem;font-family:monospace;font-size:.85rem;color:var(--gold);
  letter-spacing:.08em;
}

/* ── PLAN TABLE ── */
.plan-table-wrap{margin-top:.85rem;overflow-x:auto;border:1px solid var(--border2);border-radius:12px;background:rgba(5,5,7,.4)}
.pt-day-block{border-bottom:1px solid var(--border2);padding:0}
.pt-day-block:last-of-type{border-bottom:none}
.pt-day-header{
  display:flex;align-items:center;justify-content:space-between;gap:.8rem;
  background:rgba(201,162,74,.06);padding:.6rem .9rem;
  border-bottom:1px solid rgba(201,162,74,.12);cursor:pointer;user-select:none;
}
.pt-day-header:hover{background:rgba(201,162,74,.1)}
.pt-day-label{font-weight:700;color:var(--gold);font-size:.78rem;white-space:nowrap}
.pt-day-chevron{color:var(--muted);font-size:.7rem;transition:transform .2s}
.pt-day-block.collapsed .pt-day-body{display:none}
.pt-day-block.collapsed .pt-day-chevron{transform:rotate(-90deg)}
.pt-day-body{padding:.5rem .9rem .75rem}
.pt-row{display:flex;gap:.5rem;margin-bottom:.45rem;align-items:center;flex-wrap:wrap}
.pt-row-label{font-size:.68rem;font-weight:600;color:var(--muted);min-width:90px;text-transform:uppercase;letter-spacing:.05em;flex-shrink:0}
.pt-in{
  background:rgba(255,255,255,.05);border:1px solid rgba(244,241,232,.1);
  border-radius:6px;padding:.32rem .5rem;color:var(--text);
  font-family:'Manrope',sans-serif;font-size:.76rem;outline:none;
  flex:1;min-width:0;transition:border-color .18s;
}
.pt-in:focus{border-color:rgba(201,162,74,.5);background:rgba(201,162,74,.04)}
.pt-in::placeholder{color:var(--muted2)}
.pt-in.narrow{flex:0 0 58px;width:58px;text-align:center}
.pt-select{
  background:rgba(255,255,255,.05);border:1px solid rgba(244,241,232,.1);
  border-radius:6px;padding:.32rem .5rem;color:var(--text);
  font-family:'Manrope',sans-serif;font-size:.76rem;outline:none;cursor:pointer;
}
.pt-select:focus{border-color:rgba(201,162,74,.5)}
.pt-totals-block{
  background:rgba(201,162,74,.08);border:1px solid rgba(201,162,74,.15);
  border-radius:10px;padding:.6rem .65rem;margin-bottom:.6rem;
}
.pt-macro-row{display:flex;gap:.5rem;margin-bottom:0;flex-wrap:wrap}
.pt-macro-grp{display:flex;flex-direction:column;align-items:center;flex:1;min-width:70px}
.pt-macro-lbl{font-size:.62rem;color:var(--gold);text-transform:uppercase;letter-spacing:.08em;margin-bottom:.2rem;font-weight:700}
.pt-meal-block{
  background:rgba(255,255,255,.025);border:1px solid rgba(244,241,232,.06);
  border-radius:10px;padding:.5rem .65rem;margin-bottom:.45rem;
}
.pt-meal-name{font-size:.72rem;font-weight:700;color:var(--text);margin-bottom:.35rem;display:flex;align-items:center;gap:.4rem}
.pt-meal-name .pt-meal-time{font-weight:400;color:var(--muted);font-size:.68rem}
.pt-note-row{margin-top:.55rem;border-top:1px solid rgba(244,241,232,.06);padding-top:.5rem}
.pt-note-label{font-size:.68rem;font-weight:700;color:var(--gold);margin-bottom:.25rem;display:flex;align-items:center;gap:.3rem}
.pt-shop-btn{
  margin-top:.35rem;background:none;border:1px solid rgba(201,162,74,.3);
  border-radius:8px;padding:.3rem .7rem;color:var(--gold);font-size:.68rem;
  font-family:'Manrope',sans-serif;cursor:pointer;transition:all .18s;
}
.pt-shop-btn:hover{background:rgba(201,162,74,.1);border-color:rgba(201,162,74,.5)}
.pt-shop-list{
  display:none;margin-top:.4rem;padding:.5rem .7rem;
  background:rgba(201,162,74,.04);border:1px solid rgba(201,162,74,.12);
  border-radius:8px;font-size:.72rem;color:var(--text);line-height:1.7;
}
.pt-shop-list.visible{display:block}
.pt-save-wrap{padding:.85rem .9rem;display:flex;align-items:center;gap:.75rem;border-top:1px solid var(--border)}
.pt-save-btn{
  background:linear-gradient(135deg,#c9a24a,#a6c85e);color:#070707;border:none;
  border-radius:10px;padding:.55rem 1.4rem;font-family:'Manrope',sans-serif;
  font-size:.8rem;font-weight:700;cursor:pointer;
  box-shadow:0 4px 16px rgba(201,162,74,.28);transition:transform .15s,box-shadow .15s;
}
.pt-save-btn:hover:not(:disabled){transform:scale(1.04);box-shadow:0 6px 20px rgba(201,162,74,.4)}
.pt-save-btn:disabled{opacity:.4;cursor:default}
.pt-status{font-size:.74rem;color:var(--muted);flex:1}
.pt-status.ok{color:var(--green)} .pt-status.err{color:#e07070}

/* typing indicator */
.typing{display:flex;align-items:center;gap:.3rem;padding:.5rem .75rem}
.typing span{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:bounce .9s infinite}
.typing span:nth-child(2){animation-delay:.15s}
.typing span:nth-child(3){animation-delay:.3s}
@keyframes bounce{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-5px)}}

/* input area */
.chat-input-area{
  padding:.85rem 1.25rem;border-top:1px solid var(--border);
  background:rgba(5,5,7,.8);flex-shrink:0;
  display:flex;gap:.75rem;align-items:flex-end;
}
.chat-textarea{
  flex:1;background:rgba(255,255,255,.05);border:1px solid var(--border2);
  border-radius:12px;padding:.7rem 1rem;color:var(--text);
  font-family:'Manrope',sans-serif;font-size:.85rem;line-height:1.5;
  resize:none;outline:none;min-height:44px;max-height:160px;
  transition:border-color .2s;
}
.chat-textarea:focus{border-color:rgba(201,162,74,.45)}
.chat-textarea::placeholder{color:var(--muted2)}
.send-btn{
  width:42px;height:42px;border-radius:50%;border:none;cursor:pointer;flex-shrink:0;
  background:linear-gradient(135deg,#c9a24a,#a6c85e);color:#070707;
  font-size:1rem;display:flex;align-items:center;justify-content:center;
  transition:transform .15s,box-shadow .15s;box-shadow:0 4px 16px rgba(201,162,74,.3);
}
.send-btn:hover:not(:disabled){transform:scale(1.07);box-shadow:0 6px 20px rgba(201,162,74,.45)}
.send-btn:disabled{opacity:.4;cursor:default}
</style>
</head>
<body>

<!-- HEADER -->
<header class="header">
  <span class="header-logo">DARE</span>
  <div class="header-right">
    <div class="coach-badge">
      <div class="coach-avatar" id="coach-avatar">?</div>
      <div>
        <div class="coach-name" id="coach-name">Coach</div>
        <div class="coach-role" id="coach-role">—</div>
      </div>
    </div>
    <button class="logout-btn" id="logout-btn">Salir</button>
  </div>
</header>

<div class="layout">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="sidebar-head">
      <div class="sidebar-title">Clientes</div>
      <input class="sidebar-search" id="search" placeholder="Buscar…" autocomplete="off">
    </div>
    <div class="client-list" id="client-list"></div>
    <div class="sidebar-footer">
      <button class="new-client-btn" id="new-client-btn">
        <span>+</span> Nuevo cliente
      </button>
    </div>
  </aside>

  <!-- CHAT -->
  <main class="chat-area">
    <div class="chat-context" id="chat-context">
      <div class="ctx-avatar" id="ctx-avatar"></div>
      <span class="ctx-label">Para: <strong class="ctx-name" id="ctx-name"></strong></span>
      <button class="ctx-clear" id="ctx-clear" title="Quitar selección">✕</button>
    </div>

    <div class="messages" id="messages">
      <div class="welcome" id="welcome">
        <h2 id="welcome-name">Hola</h2>
        <p>Selecciona un cliente en la barra lateral y escríbeme qué plan necesitas, o pídeme que dé de alta un cliente nuevo.</p>
      </div>
    </div>

    <div class="chat-input-area">
      <textarea class="chat-textarea" id="chat-input" placeholder="Escribe aquí…" rows="1"></textarea>
      <button class="send-btn" id="send-btn" title="Enviar">›</button>
    </div>
  </main>

</div>

<script>
(function(){

const BASE = window.location.origin;

// ── Auth ──────────────────────────────────────────────────────
function storedToken(){ return sessionStorage.getItem('dare_token') }

function logout(){ sessionStorage.clear(); location.href = BASE + '/client.html?logout'; }

document.getElementById('logout-btn').addEventListener('click', logout);

// Token is read from sessionStorage (same-origin, persists across navigation).
// We intentionally do NOT accept tokens via URL (?t=) so they can't leak into
// browser history, server logs, or Referer headers.
let me = null; // set after async init

async function initAuth(){
  const t = storedToken();
  if(!t){ location.href = BASE + '/client.html'; return false; }
  try{
    const r = await fetch(`${BASE}/api/auth/me`, { headers:{ Authorization:`Bearer ${t}` } });
    if(!r.ok){ sessionStorage.clear(); location.href = BASE + '/client.html'; return false; }
    const user = await r.json();
    if(user.role !== 'coach'){ location.href = BASE + '/client.html'; return false; }
    sessionStorage.setItem('dare_client', JSON.stringify(user));
    me = user;
    return true;
  }catch{ location.href = BASE + '/client.html'; return false; }
}

// ── Init UI (runs after auth) ────────────────────────────────
let initials = '';
function initUI(){
  initials = (me.name||'').split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();
  document.getElementById('coach-avatar').textContent = initials;
  document.getElementById('coach-name').textContent   = me.name;
  document.getElementById('coach-role').textContent   = me.specialty === 'training' ? 'Entrenamiento' : 'Nutrición';
  document.getElementById('welcome-name').textContent = `Hola, ${me.name.split(' ')[0]}`;
}

// ── Client list ───────────────────────────────────────────────
let allClients = [];
let activeClient = null;

async function loadClients(){
  try{
    const r = await fetch(`${BASE}/api/coach/clients`, { headers:{ Authorization:`Bearer ${storedToken()}` } });
    if(!r.ok) return;
    allClients = await r.json();
    renderClients(allClients);
  }catch(e){ console.error(e) }
}

function renderClients(list){
  const el = document.getElementById('client-list');
  el.innerHTML = '';
  if(!list.length){
    el.innerHTML = '<p style="padding:1rem;font-size:.75rem;color:var(--muted2);text-align:center">Sin clientes todavía</p>';
    return;
  }
  list.forEach(c => {
    const div = document.createElement('div');
    div.className = 'client-item' + (activeClient?.id === c.id ? ' active' : '');
    div.dataset.id = c.id;
    // Adherence chip — show done/logged/days in last 7 days
    const adh = c.adherence || {};
    const adhDone  = adh.done  ?? 0;
    const adhLogged= adh.logged?? 0;
    const adhDays  = adh.days  ?? 7;
    const adhPct   = adhDays ? Math.round(adhDone/adhDays*100) : null;
    const adhColor = adhPct===null?'var(--muted2)':adhPct>=80?'var(--green)':adhPct>=50?'var(--gold)':'#e08080';
    const adhText  = adhPct===null?'—':adhLogged===0?'No logs yet':`${adhDone}/${adhDays} done`;
    div.innerHTML = `
      <div class="ci-avatar">${(c.initials||'').slice(0,2)}</div>
      <div class="ci-info">
        <div class="ci-name">${c.name}</div>
        <div class="ci-sub">W${c.currentWeek} · ${c.goal}</div>
      </div>
      <div class="ci-adh" title="Training adherence last 7 days" style="font-size:.6rem;font-weight:700;color:${adhColor};white-space:nowrap;flex-shrink:0">${adhText}</div>`;
    div.addEventListener('click', () => selectClient(c));
    el.appendChild(div);
  });
}

function selectClient(c){
  activeClient = c;
  document.getElementById('ctx-avatar').textContent = (c.initials||'').slice(0,2);
  document.getElementById('ctx-name').textContent   = c.name;
  document.getElementById('chat-context').classList.add('visible');
  document.getElementById('chat-input').placeholder = `Plan para ${c.name.split(' ')[0]}…`;
  renderClients(filterClients(document.getElementById('search').value));
}

document.getElementById('ctx-clear').addEventListener('click', () => {
  activeClient = null;
  document.getElementById('chat-context').classList.remove('visible');
  document.getElementById('chat-input').placeholder = 'Escribe aquí…';
  renderClients(filterClients(document.getElementById('search').value));
});

document.getElementById('search').addEventListener('input', e => {
  renderClients(filterClients(e.target.value));
});

function filterClients(q){
  if(!q.trim()) return allClients;
  const lq = q.toLowerCase();
  return allClients.filter(c => c.name.toLowerCase().includes(lq) || c.goal.toLowerCase().includes(lq));
}

document.getElementById('new-client-btn').addEventListener('click', () => {
  activeClient = null;
  document.getElementById('chat-context').classList.remove('visible');
  document.getElementById('chat-input').placeholder = 'Escribe aquí…';
  document.getElementById('chat-input').value = 'Quiero dar de alta un nuevo cliente';
  document.getElementById('chat-input').focus();
  renderClients(filterClients(''));
});

// ── Chat ──────────────────────────────────────────────────────
let chatHistory = [];

const messagesEl = document.getElementById('messages');
const inputEl    = document.getElementById('chat-input');
const sendEl     = document.getElementById('send-btn');

function scrollBottom(){ messagesEl.scrollTop = messagesEl.scrollHeight; }

function appendMsg(role, content, action){
  document.getElementById('welcome')?.remove();

  const wrap = document.createElement('div');
  wrap.className = `msg ${role}`;

  const av = document.createElement('div');
  av.className = 'msg-avatar';
  av.textContent = role === 'user'
    ? initials
    : (me?.specialty === 'training' ? 'E' : 'D');

  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = content;

  // action card (plan saved / client created)
  if(action?.type === 'plan_saved'){
    const card = document.createElement('div');
    card.className = 'action-card';
    card.innerHTML = `
      <div class="ac-head"><span class="ac-icon">✅</span><span class="ac-title">Plan guardado en el portal</span></div>
      <div class="ac-row"><strong>Cliente:</strong> ${action.clientId}</div>
      <div class="ac-row"><strong>Semana del:</strong> ${action.weekOf}</div>
      <div class="ac-row"><strong>Tipo:</strong> ${action.toolName === 'save_training_plan' ? 'Entrenamiento' : 'Nutrición'}</div>`;
    bubble.appendChild(card);
  }

  if(action?.type === 'password_reset'){
    const card = document.createElement('div');
    card.className = 'action-card gold';
    card.innerHTML = `
      <div class="ac-head"><span class="ac-icon">🔑</span><span class="ac-title">Contraseña reseteada</span></div>
      <div class="ac-row"><strong>Cliente:</strong> ${action.clientName}</div>
      <div class="ac-row">Nueva contraseña temporal:</div>
      <div class="ac-pwd">${action.password}</div>`;
    bubble.appendChild(card);
  }

  if(action?.type === 'client_created'){
    const c = action.client;
    const card = document.createElement('div');
    card.className = 'action-card gold';
    card.innerHTML = `
      <div class="ac-head"><span class="ac-icon">🆕</span><span class="ac-title">Cliente creado</span></div>
      <div class="ac-row"><strong>Nombre:</strong> ${c.name}</div>
      <div class="ac-row"><strong>Email:</strong> ${c.email}</div>
      <div class="ac-row"><strong>Protocolo:</strong> ${c.goal}</div>
      <div class="ac-row">Contraseña inicial:</div>
      <div class="ac-pwd">${action.password}</div>`;
    bubble.appendChild(card);
    loadClients(); // refresh sidebar
  }

  wrap.appendChild(av);
  wrap.appendChild(bubble);

  if(action?.type === 'show_template'){
    const tbl = action.specialty === 'nutrition'
      ? buildNutritionTable(action)
      : buildTrainingTable(action);
    // Table goes full-width below the bubble, not inside it
    const fullRow = document.createElement('div');
    fullRow.style.cssText='margin-top:.75rem;max-width:calc(100% - 36px);margin-left:36px';
    fullRow.appendChild(tbl);
    wrap.style.flexDirection='column';
    wrap.appendChild(fullRow);
  }

  messagesEl.appendChild(wrap);
  scrollBottom();
}

// ── Plan Tables ───────────────────────────────────────────────

function ptIn(ph, narrow, data){
  const i=document.createElement('input'); i.className='pt-in'+(narrow?' narrow':'');
  i.type='text'; i.placeholder=ph||'';
  if(data) Object.entries(data).forEach(([k,v])=>i.dataset[k]=v);
  return i;
}

const MEAL_NAMES=['Breakfast','Morning Snack','Lunch','Snack','Dinner'];
const MEAL_TIMES=['08:00','11:00','14:00','17:00','20:30'];

function buildNutritionTable(action){
  const wrap=document.createElement('div'); wrap.className='plan-table-wrap';

  action.days.forEach((day,di)=>{
    const block=document.createElement('div'); block.className='pt-day-block'+(di>0?' collapsed':'');
    const hdr=document.createElement('div'); hdr.className='pt-day-header';
    hdr.innerHTML=`<span class="pt-day-label">${day.label}</span><span class="pt-day-chevron">▼</span>`;
    hdr.addEventListener('click',()=>block.classList.toggle('collapsed'));
    const body=document.createElement('div'); body.className='pt-day-body';

    // Day totals section
    const totRow=document.createElement('div'); totRow.className='pt-totals-block';
    totRow.innerHTML=`<div style="font-weight:700;color:var(--gold);margin-bottom:.35rem;font-size:.75rem">Daily Totals</div>`;
    const macRow=document.createElement('div'); macRow.className='pt-macro-row';
    ['kcal','Protein','Carbs','Fat'].forEach((label,li)=>{
      const grp=document.createElement('div'); grp.className='pt-macro-grp';
      const unit = label==='kcal' ? '' : ' (g)';
      grp.innerHTML=`<span class="pt-macro-lbl">${label}${unit}</span>`;
      const ph = label==='kcal' ? '2100' : label==='Protein' ? '160' : label==='Carbs' ? '220' : '70';
      grp.appendChild(ptIn(ph,true,{field:['kcal','protein','carbs','fat'][li],day:di,type:'daily'}));
      macRow.appendChild(grp);
    });
    totRow.appendChild(macRow);
    body.appendChild(totRow);

    // 5 fixed meals with dishes/ingredients
    MEAL_NAMES.forEach((mName,mi)=>{
      const mb=document.createElement('div'); mb.className='pt-meal-block';
      mb.innerHTML=`<div class="pt-meal-name"><span>${mName}</span><span class="pt-meal-time">${MEAL_TIMES[mi]}</span></div>`;
      const dishRow=document.createElement('div'); dishRow.className='pt-row';
      dishRow.appendChild(Object.assign(document.createElement('span'),{className:'pt-row-label',textContent:'Dishes'}));
      dishRow.appendChild(ptIn('e.g. grilled chicken breast, brown rice, broccoli',false,{field:'dishes',day:di,meal:mi}));
      mb.appendChild(dishRow);
      body.appendChild(mb);
    });

    // Daniel's Note
    const noteDiv=document.createElement('div'); noteDiv.className='pt-note-row';
    noteDiv.innerHTML=`<div class="pt-note-label">📝 Daniel's Note</div>`;
    noteDiv.appendChild(ptIn('Write your note — AI will translate and refine it',false,{field:'note',day:di}));
    body.appendChild(noteDiv);

    block.appendChild(hdr); block.appendChild(body); wrap.appendChild(block);
  });

  wrap.appendChild(buildSaveRow(action,'nutrition'));
  return wrap;
}

function buildTrainingTable(action){
  const wrap=document.createElement('div'); wrap.className='plan-table-wrap';

  action.days.forEach((day,di)=>{
    const block=document.createElement('div'); block.className='pt-day-block'+(di>0?' collapsed':'');
    const hdr=document.createElement('div'); hdr.className='pt-day-header';
    hdr.innerHTML=`<span class="pt-day-label">${day.label}</span><span class="pt-day-chevron">▼</span>`;
    hdr.addEventListener('click',()=>block.classList.toggle('collapsed'));
    const body=document.createElement('div'); body.className='pt-day-body';

    // Type + Session row
    const topRow=document.createElement('div'); topRow.className='pt-row';
    topRow.appendChild(Object.assign(document.createElement('span'),{className:'pt-row-label',textContent:'Type'}));
    const sel=document.createElement('select'); sel.className='pt-select'; sel.dataset.field='type'; sel.dataset.day=di;
    [['strength','Strength'],['cardio','Cardio'],['rest','Rest / Recovery']].forEach(([v,l])=>{
      const o=document.createElement('option'); o.value=v; o.textContent=l; sel.appendChild(o);
    });
    topRow.appendChild(sel);
    topRow.appendChild(Object.assign(document.createElement('span'),{className:'pt-row-label',textContent:'Session',style:'margin-left:.5rem'}));
    topRow.appendChild(ptIn('e.g. Upper Body Push',false,{field:'session',day:di}));
    body.appendChild(topRow);

    // 6 exercise slots
    for(let ei=0;ei<6;ei++){
      const exBlock=document.createElement('div'); exBlock.className='pt-meal-block';
      exBlock.innerHTML=`<div class="pt-meal-name">Exercise ${ei+1}</div>`;
      const nameRow=document.createElement('div'); nameRow.className='pt-row';
      nameRow.appendChild(Object.assign(document.createElement('span'),{className:'pt-row-label',textContent:'Name'}));
      nameRow.appendChild(ptIn('e.g. bench press',false,{field:'exname',day:di,ex:ei}));
      exBlock.appendChild(nameRow);
      const detailRow=document.createElement('div'); detailRow.className='pt-row';
      detailRow.appendChild(Object.assign(document.createElement('span'),{className:'pt-row-label',textContent:'Sets × Reps'}));
      detailRow.appendChild(ptIn('e.g. 4×8 @70%',false,{field:'setsreps',day:di,ex:ei}));
      detailRow.appendChild(Object.assign(document.createElement('span'),{className:'pt-row-label',textContent:'Notes',style:'margin-left:.5rem'}));
      detailRow.appendChild(ptIn('Technique, rest, tempo…',false,{field:'exnote',day:di,ex:ei}));
      exBlock.appendChild(detailRow);
      body.appendChild(exBlock);
    }

    // Erika's Note
    const noteDiv=document.createElement('div'); noteDiv.className='pt-note-row';
    noteDiv.innerHTML=`<div class="pt-note-label">📝 Erika's Note</div>`;
    noteDiv.appendChild(ptIn('Write your note — AI will translate and refine it',false,{field:'note',day:di}));
    body.appendChild(noteDiv);

    block.appendChild(hdr); block.appendChild(body); wrap.appendChild(block);
  });

  wrap.appendChild(buildSaveRow(action,'training'));
  return wrap;
}

function buildSaveRow(action, specialty){
  const div=document.createElement('div'); div.className='pt-save-wrap';
  const btn=document.createElement('button'); btn.className='pt-save-btn'; btn.textContent='Save Plan →';
  const status=document.createElement('span'); status.className='pt-status'; status.textContent='Fill in the fields and save.';
  div.appendChild(btn); div.appendChild(status);

  btn.addEventListener('click', async ()=>{
    btn.disabled=true; status.className='pt-status'; status.textContent='Saving — AI is perfecting names and generating details…';
    try{
      const days = specialty==='nutrition' ? collectNutrition(div.closest('.plan-table-wrap'),action) : collectTraining(div.closest('.plan-table-wrap'),action);
      const r = await fetch(`${BASE}/api/coach/save-plan-table`,{
        method:'POST',
        headers:{'Content-Type':'application/json', Authorization:`Bearer ${storedToken()}`},
        body: JSON.stringify({specialty, clientId:action.clientId, weekOf:action.weekOf, days}),
      });
      const data=await r.json();
      if(r.ok){
        status.textContent='✅ Plan saved to client portal.'; status.className='pt-status ok';
        btn.textContent='Saved ✓';
        const confirmMsg=`${specialty==='nutrition'?'Nutrition':'Training'} plan saved for ${action.clientName} — week of ${action.weekOf}.`;
        appendMsg('assistant', confirmMsg);
        chatHistory.push({role:'assistant', content: confirmMsg});
      } else {
        status.textContent='❌ '+(data.error||'Failed to save.'); status.className='pt-status err';
        btn.disabled=false;
      }
    }catch(e){
      status.textContent='❌ Connection error.'; status.className='pt-status err'; btn.disabled=false;
    }
  });
  return div;
}

function q(wrap,field,day,extra){
  const sel=extra!==undefined
    ? `[data-field="${field}"][data-day="${day}"][data-${extra[0]}="${extra[1]}"]`
    : `[data-field="${field}"][data-day="${day}"]`;
  return (wrap.querySelector(sel)||{}).value||'';
}

function collectNutrition(wrap,action){
  return action.days.map((day,di)=>{
    const meals=[];
    for(let mi=0;mi<5;mi++){
      const dishes=q(wrap,'dishes',di,['meal',mi]);
      if(!dishes) continue;
      meals.push({
        name:MEAL_NAMES[mi], time:MEAL_TIMES[mi], dishes:dishes,
      });
    }
    return {
      label:day.shortLabel, fullDate:day.fullDate,
      kcal:Number(q(wrap,'kcal',di,['type','daily']))||0,
      protein:Number(q(wrap,'protein',di,['type','daily']))||0,
      carbs:Number(q(wrap,'carbs',di,['type','daily']))||0,
      fat:Number(q(wrap,'fat',di,['type','daily']))||0,
      note:q(wrap,'note',di), meals
    };
  });
}

function collectTraining(wrap,action){
  return action.days.map((day,di)=>{
    const type=q(wrap,'type',di)||'rest';
    const exercises=[];
    for(let ei=0;ei<6;ei++){
      const name=q(wrap,'exname',di,['ex',ei]);
      if(name) exercises.push({name, setsReps:q(wrap,'setsreps',di,['ex',ei]), notes:q(wrap,'exnote',di,['ex',ei])});
    }
    return {label:day.shortLabel, fullDate:day.fullDate, type, session:q(wrap,'session',di)||(type==='rest'?'Active Rest':'Training'), note:q(wrap,'note',di), exercises};
  });
}

function showTyping(){
  const t = document.createElement('div');
  t.className = 'msg assistant';
  t.id = 'typing-indicator';
  t.innerHTML = `<div class="msg-avatar">${me?.specialty==='training'?'E':'D'}</div>
    <div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>`;
  messagesEl.appendChild(t);
  scrollBottom();
  return t;
}

async function send(){
  const text = inputEl.value.trim();
  if(!text || !me) return;

  inputEl.value = '';
  inputEl.style.height = 'auto';
  sendEl.disabled = true;

  // Inject selected client context into message
  let contextNote = '';
  if(activeClient) contextNote = ` [Cliente seleccionado: ${activeClient.name} (id: ${activeClient.id})]`;
  const fullText = text + contextNote;

  appendMsg('user', text);
  chatHistory.push({ role:'user', content: fullText });

  let typing = null;
  try{
    typing = showTyping();
    const r = await fetch(`${BASE}/api/coach/chat`, {
      method:'POST',
      headers:{ 'Content-Type':'application/json', Authorization:`Bearer ${storedToken()}` },
      body: JSON.stringify({ messages: chatHistory }),
    });
    typing.remove();

    if(!r.ok){ appendMsg('assistant','Error al conectar con el servidor.'); return; }
    const data = await r.json();
    const reply = data.reply || '…';

    appendMsg('assistant', reply, data.action);
    chatHistory.push({ role:'assistant', content: reply });
  }catch(err){
    if(typing) typing.remove();
    appendMsg('assistant','No se pudo conectar con el servidor.');
    chatHistory.pop();
  }finally{
    sendEl.disabled = false;
    inputEl.focus();
  }
}

sendEl.addEventListener('click', send);
inputEl.addEventListener('keydown', e => {
  if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); send(); }
});

// Auto-resize textarea
inputEl.addEventListener('input', () => {
  inputEl.style.height = 'auto';
  inputEl.style.height = Math.min(inputEl.scrollHeight, 160) + 'px';
});

async function main(){
  const ok = await initAuth();
  if(!ok) return;
  initUI();
  loadClients();
}
main();

})();
</script>
