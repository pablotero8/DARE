<!DOCTYPE html>
<html lang="en" translate="no">
<head>
<meta charset="UTF-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coach | DARE</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tulpen+One&family=Manrope:wght@300;400;600;700&display=swap">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#050507;--border:rgba(244,241,232,.10);--border2:rgba(244,241,232,.18);
  --text:#f4f1e8;--muted:rgba(244,241,232,.55);--muted2:rgba(244,241,232,.32);
  --gold:#c9a24a;--gold-dim:rgba(201,162,74,.16);
  --green:#a6c85e;--green-dim:rgba(166,200,94,.15);
  --shadow:0 24px 60px rgba(0,0,0,.6);--r:14px;
}
html,body{height:100%;overflow:hidden}
body{
  background:var(--bg);color:var(--text);
  font-family:'Manrope',system-ui,sans-serif;
  display:flex;flex-direction:column;
}
h1,h2,h3{font-family:'Tulpen One',serif;letter-spacing:.07em}

/* ── HEADER ── */
.header{
  display:flex;align-items:center;justify-content:space-between;
  padding:.75rem 1.5rem;border-bottom:1px solid var(--border);
  background:rgba(5,5,7,.9);backdrop-filter:blur(18px);flex-shrink:0;
}
.header-logo{font-family:'Tulpen One',serif;font-size:1.8rem;letter-spacing:.12em;color:var(--text)}
.header-right{display:flex;align-items:center;gap:.75rem}
.coach-badge{
  display:flex;align-items:center;gap:.5rem;
  background:rgba(255,255,255,.05);border:1px solid var(--border2);
  border-radius:999px;padding:.35rem .75rem .35rem .45rem;
}
.coach-avatar{
  width:28px;height:28px;border-radius:50%;
  background:linear-gradient(135deg,rgba(201,162,74,.5),rgba(166,200,94,.4));
  display:flex;align-items:center;justify-content:center;
  font-size:.62rem;font-weight:700;color:var(--gold);flex-shrink:0;
}
.coach-name{font-size:.72rem;font-weight:600;color:var(--text)}
.coach-role{font-size:.62rem;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.logout-btn{
  background:none;border:1px solid var(--border2);border-radius:8px;
  padding:.35rem .7rem;color:var(--muted);font-size:.72rem;cursor:pointer;
  font-family:'Manrope',sans-serif;transition:border-color .2s,color .2s;
}
.logout-btn:hover{border-color:rgba(244,241,232,.35);color:var(--text)}

/* ── LAYOUT ── */
.layout{display:flex;flex:1;overflow:hidden}

/* ── SIDEBAR ── */
.sidebar{
  width:260px;flex-shrink:0;border-right:1px solid var(--border);
  display:flex;flex-direction:column;background:rgba(5,5,7,.6);
}
.sidebar-head{
  padding:1rem 1rem .6rem;border-bottom:1px solid var(--border);
}
.sidebar-title{font-size:.65rem;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin-bottom:.6rem}
.sidebar-search{
  width:100%;background:rgba(255,255,255,.05);border:1px solid var(--border);
  border-radius:8px;padding:.5rem .75rem;color:var(--text);
  font-family:'Manrope',sans-serif;font-size:.8rem;outline:none;
  transition:border-color .2s;
}
.sidebar-search:focus{border-color:rgba(201,162,74,.4)}
.sidebar-search::placeholder{color:var(--muted2)}

.client-list{flex:1;overflow-y:auto;padding:.5rem 0;scrollbar-width:thin;scrollbar-color:var(--border) transparent}
.client-item{
  display:flex;align-items:center;gap:.6rem;padding:.6rem 1rem;cursor:pointer;
  transition:background .15s;border-left:2px solid transparent;
}
.client-item:hover{background:rgba(255,255,255,.04)}
.client-item.active{background:rgba(201,162,74,.07);border-left-color:var(--gold)}
.ci-avatar{
  width:32px;height:32px;border-radius:50%;flex-shrink:0;
  background:linear-gradient(135deg,rgba(201,162,74,.25),rgba(166,200,94,.2));
  border:1px solid var(--border2);display:flex;align-items:center;
  justify-content:center;font-size:.65rem;font-weight:700;color:var(--muted);
}
.ci-info{flex:1;min-width:0}
.ci-name{font-size:.8rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ci-sub{font-size:.67rem;color:var(--muted);margin-top:.1rem}

.sidebar-footer{padding:.75rem 1rem;border-top:1px solid var(--border)}
.new-client-btn{
  width:100%;padding:.6rem;border:1px dashed rgba(166,200,94,.3);
  border-radius:10px;background:none;color:var(--green);
  font-family:'Manrope',sans-serif;font-size:.75rem;font-weight:600;
  cursor:pointer;transition:background .2s,border-color .2s;
  display:flex;align-items:center;justify-content:center;gap:.4rem;
}
.new-client-btn:hover{background:rgba(166,200,94,.06);border-color:rgba(166,200,94,.5)}

/* ── CHAT ── */
.chat-area{display:flex;flex-direction:column;flex:1;overflow:hidden;position:relative}

.chat-context{
  display:none;align-items:center;gap:.6rem;
  padding:.6rem 1.25rem;border-bottom:1px solid var(--border);
  background:rgba(5,5,7,.5);flex-shrink:0;
}
.chat-context.visible{display:flex}
.ctx-avatar{
  width:26px;height:26px;border-radius:50%;
  background:linear-gradient(135deg,rgba(201,162,74,.3),rgba(166,200,94,.25));
  display:flex;align-items:center;justify-content:center;
  font-size:.6rem;font-weight:700;color:var(--gold);
}
.ctx-label{font-size:.75rem;color:var(--muted)}
.ctx-name{font-weight:700;color:var(--text)}
.ctx-clear{margin-left:auto;background:none;border:none;color:var(--muted2);cursor:pointer;font-size:.8rem;padding:.2rem}
.ctx-clear:hover{color:var(--text)}

.messages{flex:1;overflow-y:auto;padding:1.25rem;display:flex;flex-direction:column;gap:1rem;scrollbar-width:thin;scrollbar-color:var(--border) transparent}

.welcome{
  text-align:center;margin:auto;max-width:360px;padding:2rem 1rem;
}
.welcome h2{font-size:2.2rem;color:var(--gold);margin-bottom:.5rem}
.welcome p{font-size:.85rem;color:var(--muted);line-height:1.6}

/* bubbles */
.msg{display:flex;gap:.6rem;max-width:78%}
.msg.user{align-self:flex-end;flex-direction:row-reverse}
.msg.assistant{align-self:flex-start}
.msg-avatar{
  width:28px;height:28px;border-radius:50%;flex-shrink:0;
  background:linear-gradient(135deg,rgba(201,162,74,.35),rgba(166,200,94,.28));
  display:flex;align-items:center;justify-content:center;font-size:.6rem;font-weight:700;color:var(--gold);
  margin-top:.1rem;
}
.msg.user .msg-avatar{background:rgba(201,162,74,.2)}
.bubble{
  padding:.75rem 1rem;border-radius:var(--r);font-size:.83rem;line-height:1.6;
}
.msg.assistant .bubble{
  background:linear-gradient(160deg,rgba(255,255,255,.07),rgba(255,255,255,.03));
  border:1px solid var(--border);
}
.msg.user .bubble{
  background:linear-gradient(135deg,rgba(201,162,74,.18),rgba(201,162,74,.1));
  border:1px solid rgba(201,162,74,.25);
}

/* action cards */
.action-card{
  margin-top:.6rem;padding:1rem 1.1rem;border-radius:12px;
  background:rgba(166,200,94,.06);border:1px solid rgba(166,200,94,.22);
}
.action-card.gold{background:rgba(201,162,74,.07);border-color:rgba(201,162,74,.25)}
.ac-head{display:flex;align-items:center;gap:.5rem;margin-bottom:.6rem}
.ac-icon{font-size:1rem}
.ac-title{font-size:.8rem;font-weight:700;color:var(--green)}
.action-card.gold .ac-title{color:var(--gold)}
.ac-row{font-size:.75rem;color:var(--muted);margin:.15rem 0}
.ac-row strong{color:var(--text);font-weight:600}
.ac-pwd{
  margin-top:.6rem;background:rgba(0,0,0,.3);border-radius:8px;
  padding:.5rem .75rem;font-family:monospace;font-size:.85rem;color:var(--gold);
  letter-spacing:.08em;
}

/* ── PLAN TABLE ── */
.plan-table-wrap{margin-top:.85rem;overflow-x:auto;border:1px solid var(--border2);border-radius:12px;background:rgba(5,5,7,.4)}
.pt-day-block{border-bottom:1px solid var(--border2);padding:0}
.pt-day-block:last-of-type{border-bottom:none}
.pt-day-header{
  display:flex;align-items:center;justify-content:space-between;gap:.8rem;
  background:rgba(201,162,74,.06);padding:.6rem .9rem;
  border-bottom:1px solid rgba(201,162,74,.12);cursor:pointer;user-select:none;
}
.pt-day-header:hover{background:rgba(201,162,74,.1)}
.pt-day-label{font-weight:700;color:var(--gold);font-size:.78rem;white-space:nowrap}
.pt-day-chevron{color:var(--muted);font-size:.7rem;transition:transform .2s}
.pt-day-block.collapsed .pt-day-body{display:none}
.pt-day-block.collapsed .pt-day-chevron{transform:rotate(-90deg)}
.pt-day-body{padding:.5rem .9rem .75rem}
.pt-row{display:flex;gap:.5rem;margin-bottom:.45rem;align-items:center;flex-wrap:wrap}
.pt-row-label{font-size:.68rem;font-weight:600;color:var(--muted);min-width:90px;text-transform:uppercase;letter-spacing:.05em;flex-shrink:0}
.pt-in{
  background:rgba(255,255,255,.05);border:1px solid rgba(244,241,232,.1);
  border-radius:6px;padding:.32rem .5rem;color:var(--text);
  font-family:'Manrope',sans-serif;font-size:.76rem;outline:none;
  flex:1;min-width:0;transition:border-color .18s;
}
.pt-in:focus{border-color:rgba(201,162,74,.5);background:rgba(201,162,74,.04)}
.pt-in::placeholder{color:var(--muted2)}
.pt-in.narrow{flex:0 0 58px;width:58px;text-align:center}
.pt-in.pt-in-error{border-color:#e0524d;background:rgba(224,82,77,.12);color:#ffb4b0}
.pt-macro-warn{margin-top:.45rem;font-size:.66rem;font-weight:600;color:#e0746f;letter-spacing:.01em}
.pt-select{
  background:rgba(255,255,255,.05);border:1px solid rgba(244,241,232,.1);
  border-radius:6px;padding:.32rem .5rem;color:var(--text);
  font-family:'Manrope',sans-serif;font-size:.76rem;outline:none;cursor:pointer;
}
.pt-select:focus{border-color:rgba(201,162,74,.5)}
.pt-recipe-select{flex:1;max-width:100%;font-size:.72rem;color:var(--muted);background:rgba(201,162,74,.05);border-color:rgba(201,162,74,.14)}
.pt-recipe-select:disabled{opacity:.5;cursor:default}
.pt-totals-block{
  background:rgba(201,162,74,.08);border:1px solid rgba(201,162,74,.15);
  border-radius:10px;padding:.6rem .65rem;margin-bottom:.6rem;
}
.pt-macro-row{display:flex;gap:.5rem;margin-bottom:0;flex-wrap:wrap}
.pt-macro-grp{display:flex;flex-direction:column;align-items:center;flex:1;min-width:70px}
.pt-macro-lbl{font-size:.62rem;color:var(--gold);text-transform:uppercase;letter-spacing:.08em;margin-bottom:.2rem;font-weight:700}
.pt-meal-block{
  background:rgba(255,255,255,.025);border:1px solid rgba(244,241,232,.06);
  border-radius:10px;padding:.5rem .65rem;margin-bottom:.45rem;
}
.pt-meal-name{font-size:.72rem;font-weight:700;color:var(--text);margin-bottom:.35rem;display:flex;align-items:center;gap:.4rem}
.pt-meal-name .pt-meal-time{font-weight:400;color:var(--muted);font-size:.68rem}
.pt-note-row{margin-top:.55rem;border-top:1px solid rgba(244,241,232,.06);padding-top:.5rem}
.pt-note-label{font-size:.68rem;font-weight:700;color:var(--gold);margin-bottom:.25rem;display:flex;align-items:center;gap:.3rem}
.pt-shop-btn{
  margin-top:.35rem;background:none;border:1px solid rgba(201,162,74,.3);
  border-radius:8px;padding:.3rem .7rem;color:var(--gold);font-size:.68rem;
  font-family:'Manrope',sans-serif;cursor:pointer;transition:all .18s;
}
.pt-shop-btn:hover{background:rgba(201,162,74,.1);border-color:rgba(201,162,74,.5)}
.pt-shop-list{
  display:none;margin-top:.4rem;padding:.5rem .7rem;
  background:rgba(201,162,74,.04);border:1px solid rgba(201,162,74,.12);
  border-radius:8px;font-size:.72rem;color:var(--text);line-height:1.7;
}
.pt-shop-list.visible{display:block}
.pt-save-wrap{padding:.85rem .9rem;display:flex;align-items:center;gap:.75rem;border-top:1px solid var(--border)}
.pt-save-btn{
  background:linear-gradient(135deg,#c9a24a,#a6c85e);color:#070707;border:none;
  border-radius:10px;padding:.55rem 1.4rem;font-family:'Manrope',sans-serif;
  font-size:.8rem;font-weight:700;cursor:pointer;
  box-shadow:0 4px 16px rgba(201,162,74,.28);transition:transform .15s,box-shadow .15s;
}
.pt-save-btn:hover:not(:disabled){transform:scale(1.04);box-shadow:0 6px 20px rgba(201,162,74,.4)}
.pt-save-btn:disabled{opacity:.4;cursor:default}
.pt-status{font-size:.74rem;color:var(--muted);flex:1}
.pt-status.ok{color:var(--green)} .pt-status.err{color:#e07070}

/* typing indicator */
.typing{display:flex;align-items:center;gap:.3rem;padding:.5rem .75rem}
.typing span{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:bounce .9s infinite}
.typing span:nth-child(2){animation-delay:.15s}
.typing span:nth-child(3){animation-delay:.3s}
@keyframes bounce{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-5px)}}

/* input area */
.chat-input-area{
  padding:.85rem 1.25rem;border-top:1px solid var(--border);
  background:rgba(5,5,7,.8);flex-shrink:0;
  display:flex;gap:.75rem;align-items:flex-end;
}
.chat-textarea{
  flex:1;background:rgba(255,255,255,.05);border:1px solid var(--border2);
  border-radius:12px;padding:.7rem 1rem;color:var(--text);
  font-family:'Manrope',sans-serif;font-size:.85rem;line-height:1.5;
  resize:none;outline:none;min-height:44px;max-height:160px;
  transition:border-color .2s;
}
.chat-textarea:focus{border-color:rgba(201,162,74,.45)}
.chat-textarea::placeholder{color:var(--muted2)}
.send-btn{
  width:42px;height:42px;border-radius:50%;border:none;cursor:pointer;flex-shrink:0;
  background:linear-gradient(135deg,#c9a24a,#a6c85e);color:#070707;
  font-size:1rem;display:flex;align-items:center;justify-content:center;
  transition:transform .15s,box-shadow .15s;box-shadow:0 4px 16px rgba(201,162,74,.3);
}
.send-btn:hover:not(:disabled){transform:scale(1.07);box-shadow:0 6px 20px rgba(201,162,74,.45)}
.send-btn:disabled{opacity:.4;cursor:default}

/* ── CLIENT PROFILE PANEL ── */
.profile-panel{position:absolute;inset:0;background:var(--bg);z-index:50;display:none;flex-direction:column;overflow:hidden}
.profile-panel.open{display:flex}
.pp-head{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:.8rem 1.25rem;border-bottom:1px solid var(--border);background:rgba(5,5,7,.95);flex-shrink:0}
.pp-client{display:flex;align-items:center;gap:.75rem}
.pp-av{width:40px;height:40px;border-radius:50%;flex-shrink:0;background:linear-gradient(135deg,rgba(201,162,74,.4),rgba(166,200,94,.3));border:1.5px solid rgba(201,162,74,.35);display:flex;align-items:center;justify-content:center;font-size:.74rem;font-weight:700;color:var(--gold)}
.pp-cname{font-family:'Tulpen One',serif;font-size:1.6rem;letter-spacing:.06em;text-transform:uppercase;line-height:1}
.pp-csub{font-size:.68rem;color:var(--muted);margin-top:3px}
.pp-head-btns{display:flex;align-items:center;gap:.55rem}
.pp-chat-btn{display:flex;align-items:center;gap:.4rem;padding:.38rem .85rem;border:1px solid rgba(201,162,74,.4);border-radius:8px;background:rgba(201,162,74,.07);color:var(--gold);font-family:'Manrope',sans-serif;font-size:.72rem;font-weight:700;cursor:pointer;letter-spacing:.06em;text-transform:uppercase;transition:all .18s}
.pp-chat-btn:hover{background:rgba(201,162,74,.15);border-color:rgba(201,162,74,.6)}
.pp-close{width:30px;height:30px;border-radius:50%;border:1px solid var(--border2);background:none;color:var(--muted);cursor:pointer;font-size:.85rem;display:flex;align-items:center;justify-content:center;transition:all .18s}
.pp-close:hover{background:rgba(255,255,255,.07);color:var(--text)}
.pp-menu-btn{width:30px;height:30px;border-radius:50%;border:1px solid var(--border2);background:none;color:var(--muted);cursor:pointer;font-size:.9rem;display:flex;align-items:center;justify-content:center;transition:all .18s;position:relative}
.pp-menu-btn:hover{background:rgba(255,255,255,.07);color:var(--text)}
.pp-dropdown{display:none;position:absolute;top:100%;right:0;background:var(--bg);border:1px solid var(--border);border-radius:8px;box-shadow:0 4px 12px rgba(0,0,0,.3);z-index:100;min-width:160px;margin-top:.35rem}
.pp-dropdown.open{display:flex;flex-direction:column}
.pp-dropdown button{width:100%;padding:.5rem .75rem;border:0;background:none;color:var(--text);font-family:inherit;font-size:.75rem;text-align:left;cursor:pointer;transition:background .18s;border-bottom:1px solid var(--border2)}
.pp-dropdown button:last-child{border-bottom:0}
.pp-dropdown button:hover{background:rgba(255,255,255,.07)}
.pp-dropdown button.danger{color:#f08080}
.pp-dropdown button.danger:hover{background:rgba(220,60,60,.15)}
.pp-body{flex:1;overflow-y:auto;padding:1.25rem 1.5rem;display:flex;flex-direction:column;gap:1.5rem;scrollbar-width:thin;scrollbar-color:var(--border) transparent}
.pp-sec-label{font-size:.62rem;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);margin-bottom:.7rem}
.pp-metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:.7rem}
.pp-metric{padding:.9rem 1rem;border-radius:12px;background:linear-gradient(160deg,rgba(255,255,255,.06),rgba(255,255,255,.02));border:1px solid var(--border)}
.pp-metric-label{font-size:.58rem;letter-spacing:.18em;text-transform:uppercase;color:var(--muted2);margin-bottom:.3rem}
.pp-metric-val{font-family:'Tulpen One',serif;font-size:1.9rem;line-height:1;letter-spacing:.04em}
.pp-metric-val sup{font-size:.72rem;vertical-align:super}
.pp-metric-empty{color:var(--muted2)}
.pp-adh-wrap{display:flex;flex-direction:column;gap:.5rem}
.pp-adh-row{display:flex;align-items:center;gap:.75rem}
.pp-adh-track{flex:1;height:5px;background:rgba(255,255,255,.06);border-radius:999px;overflow:hidden}
.pp-adh-fill{height:100%;border-radius:999px;transition:width .5s ease}
.pp-adh-label{font-size:.72rem;font-weight:700;white-space:nowrap;min-width:110px;text-align:right}
.pp-log-grid{display:flex;flex-direction:column;gap:.35rem}
.pp-log-day{display:grid;grid-template-columns:120px 1fr 1fr;gap:.6rem;align-items:center;padding:.5rem .75rem;background:rgba(255,255,255,.025);border:1px solid var(--border);border-radius:8px}
.pp-log-date{font-size:.7rem;font-weight:600;color:var(--muted)}
.pp-log-chip{display:inline-flex;align-items:center;gap:.3rem;padding:.2rem .6rem;border-radius:6px;font-size:.63rem;font-weight:600;border:1px solid transparent}
.pp-log-done{background:rgba(166,200,94,.1);border-color:rgba(166,200,94,.25);color:var(--green)}
.pp-log-logged{background:rgba(201,162,74,.08);border-color:rgba(201,162,74,.2);color:var(--gold)}
.pp-log-empty{background:rgba(255,255,255,.03);border-color:var(--border);color:var(--muted2)}
.pp-checkin-row{display:flex;gap:.7rem;flex-wrap:wrap;align-items:stretch}
.pp-checkin-tile{padding:.7rem .9rem;border-radius:10px;background:rgba(255,255,255,.03);border:1px solid var(--border);min-width:90px;text-align:center}
.pp-checkin-val{font-family:'Tulpen One',serif;font-size:1.5rem;line-height:1;color:var(--text)}
.pp-checkin-lbl{font-size:.57rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted2);margin-top:.2rem}
.pp-note-tile{padding:.65rem .85rem;border-radius:10px;background:rgba(255,255,255,.03);border:1px solid var(--border);flex:1;min-width:140px;font-size:.75rem;color:var(--muted);display:flex;align-items:center;font-style:italic}
.pp-empty{font-size:.75rem;color:var(--muted2);padding:.3rem 0}
</style>
</head>
<body>

<!-- HEADER -->
<header class="header">
  <span class="header-logo" translate="no">DARE</span>
  <div class="header-right">
    <div class="coach-badge">
      <div class="coach-avatar" id="coach-avatar">?</div>
      <div>
        <div class="coach-name" id="coach-name">Coach</div>
        <div class="coach-role" id="coach-role">—</div>
      </div>
    </div>
    <button class="logout-btn" id="logout-btn">Log out</button>
  </div>
</header>

<div class="layout">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="sidebar-head">
      <div class="sidebar-title">Clients</div>
      <input class="sidebar-search" id="search" placeholder="Search…" autocomplete="off">
    </div>
    <div class="client-list" id="client-list"></div>
    <div class="sidebar-footer">
      <button class="new-client-btn" id="new-client-btn">
        <span>+</span> New client
      </button>
    </div>
  </aside>

  <!-- CHAT -->
  <main class="chat-area">

    <!-- CLIENT PROFILE PANEL -->
    <div class="profile-panel" id="profile-panel">
      <div class="pp-head">
        <div class="pp-client">
          <div class="pp-av" id="pp-av">?</div>
          <div>
            <div class="pp-cname" id="pp-cname">—</div>

        </div>
        <div class="pp-head-btns">
          <button class="pp-chat-btn" id="pp-chat-btn">✦ Select for chat</button>
          <div style="position:relative">
            <button class="pp-menu-btn" id="pp-menu-btn">⋯</button>
            <div class="pp-dropdown" id="pp-dropdown">
              <button id="pp-del-from-menu" class="danger">🗑 Delete</button>
            </div>
          </div>
          <button class="pp-close" id="pp-close">✕</button>
        </div>

      <div class="pp-body" id="pp-body">
        <div style="text-align:center;padding:3rem;color:var(--muted2);font-size:.8rem">Loading profile…</div>

    <div class="chat-context" id="chat-context">
      <div class="ctx-avatar" id="ctx-avatar"></div>
      <span class="ctx-label">For: <strong class="ctx-name" id="ctx-name"></strong></span>
      <button class="ctx-clear" id="ctx-clear" title="Clear selection">✕</button>
    </div>

    <div class="messages" id="messages">
      <div class="welcome" id="welcome">
        <h2 id="welcome-name">Hello</h2>
        <p>Select a client from the sidebar and tell me what plan you need, or ask me to create a new client.</p>
      </div>
    </div>

    <div class="chat-input-area">
      <textarea class="chat-textarea" id="chat-input" placeholder="Type here…" rows="1"></textarea>
      <button class="send-btn" id="send-btn" title="Enviar">›</button>
    </div>
  </main>

</div>

<script>
(function(){

const _isLocal = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
const BASE = _isLocal ? window.location.origin : 'https://dare-production-2636.up.railway.app';

// ── Auth ──────────────────────────────────────────────────────
function storedToken(){ return sessionStorage.getItem('dare_token') }

function logout(){ sessionStorage.clear(); location.href = BASE + '/client.html?logout'; }

document.getElementById('logout-btn').addEventListener('click', logout);

// Token is read from sessionStorage (same-origin, persists across navigation).
// We intentionally do NOT accept tokens via URL (?t=) so they can't leak into
// browser history, server logs, or Referer headers.
let me = null; // set after async init

async function initAuth(){
  const t = storedToken();
  if(!t){ location.href = BASE + '/client.html'; return false; }
  try{
    const r = await fetch(`${BASE}/api/auth/me`, { headers:{ Authorization:`Bearer ${t}` } });
    if(!r.ok){ sessionStorage.clear(); location.href = BASE + '/client.html'; return false; }
    const user = await r.json();
    if(user.role !== 'coach'){ location.href = BASE + '/client.html'; return false; }
    sessionStorage.setItem('dare_client', JSON.stringify(user));
    me = user;
    return true;
  }catch{ location.href = BASE + '/client.html'; return false; }
}

// ── Init UI (runs after auth) ────────────────────────────────
let initials = '';
function initUI(){
  initials = (me.name||'').split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();
  document.getElementById('coach-avatar').textContent = initials;
  document.getElementById('coach-name').textContent   = me.name;
  document.getElementById('coach-role').textContent   = me.specialty === 'training' ? 'Training' : 'Nutrition';
  document.getElementById('welcome-name').textContent = `Hi, ${me.name.split(' ')[0]}`;
}

// ── Client list ───────────────────────────────────────────────
let allClients = [];
let activeClient = null;

async function loadClients(){
  try{
    const r = await fetch(`${BASE}/api/coach/clients?t=${Date.now()}`, { headers:{ Authorization:`Bearer ${storedToken()}` } });
    if(!r.ok) return;
    allClients = await r.json();
    renderClients(allClients);
  }catch(e){ console.error(e) }
}

function renderClients(list){
  const el = document.getElementById('client-list');
  el.innerHTML = '';
  if(!list.length){
    el.innerHTML = '<p style="padding:1rem;font-size:.75rem;color:var(--muted2);text-align:center">No clients yet</p>';
    return;
  }
  list.forEach(c => {
    const div = document.createElement('div');
    div.className = 'client-item' + (activeClient?.id === c.id ? ' active' : '');
    div.dataset.id = c.id;
    // Adherence chip — show done/logged/days in last 7 days
    const adh = c.adherence || {};
    const adhDone  = adh.done  ?? 0;
    const adhLogged= adh.logged?? 0;
    const adhDays  = adh.days  ?? 7;
    const adhPct   = adhDays ? Math.round(adhDone/adhDays*100) : null;
    const adhColor = adhPct===null?'var(--muted2)':adhPct>=80?'var(--green)':adhPct>=50?'var(--gold)':'#e08080';
    const adhText  = adhPct===null?'—':adhLogged===0?'No logs yet':`${adhDone}/${adhDays} done`;
    div.innerHTML = `
      <div class="ci-avatar">${(c.initials||'').slice(0,2)}</div>
      <div class="ci-info">
        <div class="ci-name">${c.name}</div>
        <div class="ci-sub">W${c.currentWeek} · ${c.goal}</div>
      </div>
      <div class="ci-adh" title="Training adherence last 7 days" style="font-size:.6rem;font-weight:700;color:${adhColor};white-space:nowrap;flex-shrink:0">${adhText}</div>`;
    div.addEventListener('click', () => openProfile(c));
    el.appendChild(div);
  });
}

function selectClient(c){
  activeClient = c;
  document.getElementById('ctx-avatar').textContent = (c.initials||'').slice(0,2);
  document.getElementById('ctx-name').textContent   = c.name;
  document.getElementById('chat-context').classList.add('visible');
  document.getElementById('chat-input').placeholder = `Plan for ${c.name.split(' ')[0]}…`;
  renderClients(filterClients(document.getElementById('search').value));
}

document.getElementById('ctx-clear').addEventListener('click', () => {
  activeClient = null;
  document.getElementById('chat-context').classList.remove('visible');
  document.getElementById('chat-input').placeholder = 'Type here…';
  renderClients(filterClients(document.getElementById('search').value));
});

document.getElementById('search').addEventListener('input', e => {
  renderClients(filterClients(e.target.value));
});

function filterClients(q){
  if(!q.trim()) return allClients;
  const lq = q.toLowerCase();
  return allClients.filter(c => c.name.toLowerCase().includes(lq) || c.goal.toLowerCase().includes(lq));
}

document.getElementById('new-client-btn').addEventListener('click', () => {
  activeClient = null;
  document.getElementById('chat-context').classList.remove('visible');
  document.getElementById('chat-input').placeholder = 'Type here…';
  document.getElementById('chat-input').value = 'I want to add a new client';
  document.getElementById('chat-input').focus();
  renderClients(filterClients(''));
});

// ── Chat ──────────────────────────────────────────────────────
let chatHistory = [];

const messagesEl = document.getElementById('messages');
const inputEl    = document.getElementById('chat-input');
const sendEl     = document.getElementById('send-btn');

function scrollBottom(){ messagesEl.scrollTop = messagesEl.scrollHeight; }

function appendMsg(role, content, action){
  document.getElementById('welcome')?.remove();

  const wrap = document.createElement('div');
  wrap.className = `msg ${role}`;

  const av = document.createElement('div');
  av.className = 'msg-avatar';
  av.textContent = role === 'user'
    ? initials
    : (me?.specialty === 'training' ? 'E' : 'D');

  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = content;

  // action card (plan saved / client created)
  if(action?.type === 'plan_saved'){
    const card = document.createElement('div');
    card.className = 'action-card';
    card.innerHTML = `
      <div class="ac-head"><span class="ac-icon">✅</span><span class="ac-title">Plan saved to portal</span></div>
      <div class="ac-row"><strong>Client:</strong> ${action.clientId}</div>
      <div class="ac-row"><strong>Week of:</strong> ${action.weekOf}</div>
      <div class="ac-row"><strong>Type:</strong> ${action.toolName === 'save_training_plan' ? 'Training' : 'Nutrition'}</div>`;
    bubble.appendChild(card);
  }

  if(action?.type === 'password_reset'){
    const card = document.createElement('div');
    card.className = 'action-card gold';
    card.innerHTML = `
      <div class="ac-head"><span class="ac-icon">🔑</span><span class="ac-title">Password reset</span></div>
      <div class="ac-row"><strong>Client:</strong> ${action.clientName}</div>
      <div class="ac-row">Temporary password:</div>
      <div class="ac-pwd">${action.password}</div>`;
    bubble.appendChild(card);
  }

  if(action?.type === 'client_created'){
    const c = action.client;
    const card = document.createElement('div');
    card.className = 'action-card gold';
    card.innerHTML = `
      <div class="ac-head"><span class="ac-icon">🆕</span><span class="ac-title">Client created</span></div>
      <div class="ac-row"><strong>Name:</strong> ${c.name}</div>
      <div class="ac-row"><strong>Email:</strong> ${c.email}</div>
      <div class="ac-row"><strong>Goal:</strong> ${c.goal}</div>
      <div class="ac-row">Initial password:</div>
      <div class="ac-pwd">${action.password}</div>`;
    bubble.appendChild(card);
    loadClients(); // refresh sidebar
  }

  wrap.appendChild(av);
  wrap.appendChild(bubble);

  if(action?.type === 'show_template'){
    const tbl = action.specialty === 'nutrition'
      ? buildNutritionTable(action)
      : buildTrainingTable(action);
    // Table goes full-width below the bubble, not inside it
    const fullRow = document.createElement('div');
    fullRow.style.cssText='margin-top:.75rem;max-width:calc(100% - 36px);margin-left:36px';
    fullRow.appendChild(tbl);
    wrap.style.flexDirection='column';
    wrap.appendChild(fullRow);
  }

  messagesEl.appendChild(wrap);
  scrollBottom();
}

// ── Plan Tables ───────────────────────────────────────────────

function ptIn(ph, narrow, data){
  const i=document.createElement('input'); i.className='pt-in'+(narrow?' narrow':'');
  i.type='text'; i.placeholder=ph||'';
  if(data) Object.entries(data).forEach(([k,v])=>i.dataset[k]=v);
  return i;
}

const MEAL_NAMES=['Breakfast','Morning Snack','Lunch','Snack','Dinner'];
const MEAL_TIMES=['08:00','11:00','14:00','17:00','20:30'];

// ── Recipe library (reuse previous recipes per meal slot) ─────
const normalizeMealKey = (s)=>String(s||'').trim().toLowerCase();
let RECIPE_CACHE=null; // { grouped: { breakfast:[...], … } }

async function fetchRecipesGrouped(){
  if(RECIPE_CACHE) return RECIPE_CACHE;
  try{
    const r=await fetch(`${BASE}/api/coach/recipes`,{headers:{Authorization:`Bearer ${storedToken()}`}});
    if(!r.ok) return (RECIPE_CACHE={grouped:{}});
    const data=await r.json();
    return (RECIPE_CACHE={grouped:data.grouped||{}});
  }catch{ return (RECIPE_CACHE={grouped:{}}); }
}

// Fill every .pt-recipe-select in `wrap` with options for its meal slot.
async function populateRecipeDropdowns(wrap){
  const { grouped } = await fetchRecipesGrouped();
  wrap.querySelectorAll('.pt-recipe-select').forEach(sel=>{
    const list=grouped[sel.dataset.mealType]||[];
    if(!list.length){
      sel.options[0].textContent='↳ No previous recipes';
      sel.disabled=true;
      return;
    }
    list.forEach(rec=>{
      const o=document.createElement('option');
      o.value=rec.name;
      o.textContent=rec.name.length>52?rec.name.slice(0,52)+'…':rec.name;
      sel.appendChild(o);
    });
  });
}

function buildNutritionTable(action){
  const wrap=document.createElement('div'); wrap.className='plan-table-wrap';

  action.days.forEach((day,di)=>{
    const block=document.createElement('div'); block.className='pt-day-block'+(di>0?' collapsed':'');
    const hdr=document.createElement('div'); hdr.className='pt-day-header';
    hdr.innerHTML=`<span class="pt-day-label">${day.label}</span><span class="pt-day-chevron">▼</span>`;
    hdr.addEventListener('click',()=>block.classList.toggle('collapsed'));
    const body=document.createElement('div'); body.className='pt-day-body';

    // Day totals section
    const totRow=document.createElement('div'); totRow.className='pt-totals-block';
    totRow.innerHTML=`<div style="font-weight:700;color:var(--gold);margin-bottom:.35rem;font-size:.75rem">Daily Totals</div>`;
    const macRow=document.createElement('div'); macRow.className='pt-macro-row';
    const macInputs={};
    ['kcal','Protein','Carbs','Fat'].forEach((label,li)=>{
      const field=['kcal','protein','carbs','fat'][li];
      const grp=document.createElement('div'); grp.className='pt-macro-grp';
      const unit = label==='kcal' ? '' : ' (g)';
      grp.innerHTML=`<span class="pt-macro-lbl">${label}${unit}</span>`;
      const inp=ptIn(label==='kcal'?'2100':label==='Protein'?'160':label==='Carbs'?'220':'70',true,{field,day:di,type:'daily'});
      macInputs[field]=inp;
      grp.appendChild(inp);
      macRow.appendChild(grp);
    });
    totRow.appendChild(macRow);
    const macWarn=document.createElement('div'); macWarn.className='pt-macro-warn'; macWarn.style.display='none';
    totRow.appendChild(macWarn);
    body.appendChild(totRow);
    // Live macro/kcal coherence check (P×4 + C×4 + F×9 must ≈ kcal)
    const checkMacros=()=>validateDayMacros(macInputs,macWarn);
    Object.values(macInputs).forEach(inp=>inp.addEventListener('input',checkMacros));

    // 5 fixed meals with dishes/ingredients
    MEAL_NAMES.forEach((mName,mi)=>{
      const mb=document.createElement('div'); mb.className='pt-meal-block';
      mb.innerHTML=`<div class="pt-meal-name"><span>${mName}</span><span class="pt-meal-time">${MEAL_TIMES[mi]}</span></div>`;
      const dishRow=document.createElement('div'); dishRow.className='pt-row';
      dishRow.appendChild(Object.assign(document.createElement('span'),{className:'pt-row-label',textContent:'Dishes'}));
      const dishIn=ptIn('e.g. grilled chicken breast, brown rice, broccoli',false,{field:'dishes',day:di,meal:mi});
      dishRow.appendChild(dishIn);
      mb.appendChild(dishRow);

      // Reuse-previous-recipe dropdown (populated async from the recipe library)
      const recRow=document.createElement('div'); recRow.className='pt-row';
      recRow.appendChild(Object.assign(document.createElement('span'),{className:'pt-row-label',textContent:'Reuse'}));
      const recSel=document.createElement('select');
      recSel.className='pt-select pt-recipe-select';
      recSel.dataset.mealType=normalizeMealKey(mName);
      recSel.innerHTML='<option value="">↳ Previous recipes…</option>';
      recSel.addEventListener('change',()=>{
        if(recSel.value){ dishIn.value=recSel.value; dishIn.dispatchEvent(new Event('input')); recSel.selectedIndex=0; }
      });
      recRow.appendChild(recSel);
      mb.appendChild(recRow);

      body.appendChild(mb);
    });

    // Daniel's Note
    const noteDiv=document.createElement('div'); noteDiv.className='pt-note-row';
    noteDiv.innerHTML=`<div class="pt-note-label">📝 Daniel's Note</div>`;
    noteDiv.appendChild(ptIn('Write your note — AI will translate and refine it',false,{field:'note',day:di}));
    body.appendChild(noteDiv);

    block.appendChild(hdr); block.appendChild(body); wrap.appendChild(block);
  });

  wrap.appendChild(buildSaveRow(action,'nutrition'));
  populateRecipeDropdowns(wrap); // async — fills the reuse dropdowns when ready
  return wrap;
}

function buildTrainingTable(action){
  const wrap=document.createElement('div'); wrap.className='plan-table-wrap';

  action.days.forEach((day,di)=>{
    const block=document.createElement('div'); block.className='pt-day-block'+(di>0?' collapsed':'');
    const hdr=document.createElement('div'); hdr.className='pt-day-header';
    hdr.innerHTML=`<span class="pt-day-label">${day.label}</span><span class="pt-day-chevron">▼</span>`;
    hdr.addEventListener('click',()=>block.classList.toggle('collapsed'));
    const body=document.createElement('div'); body.className='pt-day-body';

    // Type + Session row
    const topRow=document.createElement('div'); topRow.className='pt-row';
    topRow.appendChild(Object.assign(document.createElement('span'),{className:'pt-row-label',textContent:'Type'}));
    const sel=document.createElement('select'); sel.className='pt-select'; sel.dataset.field='type'; sel.dataset.day=di;
    [['strength','Strength'],['cardio','Cardio'],['rest','Rest / Recovery']].forEach(([v,l])=>{
      const o=document.createElement('option'); o.value=v; o.textContent=l; sel.appendChild(o);
    });
    topRow.appendChild(sel);

    topRow.appendChild(ptIn('e.g. Upper Body Push',false,{field:'session',day:di}));

    // 6 exercise slots
    for(let ei=0;ei<6;ei++){
      const exBlock=document.createElement('div'); exBlock.className='pt-meal-block';
      exBlock.innerHTML=`<div class="pt-meal-name">Exercise ${ei+1}</div>`;
      const nameRow=document.createElement('div'); nameRow.className='pt-row';
      nameRow.appendChild(Object.assign(document.createElement('span'),{className:'pt-row-label',textContent:'Name'}));
      nameRow.appendChild(ptIn('e.g. bench press',false,{field:'exname',day:di,ex:ei}));
      exBlock.appendChild(nameRow);
      const detailRow=document.createElement('div'); detailRow.className='pt-row';
      detailRow.appendChild(Object.assign(document.createElement('span'),{className:'pt-row-label',textContent:'Sets × Reps'}));
      detailRow.appendChild(ptIn('e.g. 4×8 @70%',false,{field:'setsreps',day:di,ex:ei}));
      detailRow.appendChild(Object.assign(document.createElement('span'),{className:'pt-row-label',textContent:'Notes',style:'margin-left:.5rem'}));
      detailRow.appendChild(ptIn('Technique, rest, tempo…',false,{field:'exnote',day:di,ex:ei}));
      exBlock.appendChild(detailRow);
      body.appendChild(exBlock);
    }

    // Erika's Note
    const noteDiv=document.createElement('div'); noteDiv.className='pt-note-row';
    noteDiv.innerHTML=`<div class="pt-note-label">📝 Erika's Note</div>`;
    noteDiv.appendChild(ptIn('Write your note — AI will translate and refine it',false,{field:'note',day:di}));
    body.appendChild(noteDiv);

    block.appendChild(hdr); block.appendChild(body); wrap.appendChild(block);
  });

  wrap.appendChild(buildSaveRow(action,'training'));
  return wrap;
}

function buildSaveRow(action, specialty){
  const div=document.createElement('div'); div.className='pt-save-wrap';
  const btn=document.createElement('button'); btn.className='pt-save-btn'; btn.textContent='Save Plan →';
  const status=document.createElement('span'); status.className='pt-status'; status.textContent='Fill in the fields and save.';
  div.appendChild(btn); div.appendChild(status);

  btn.addEventListener('click', async ()=>{
    // Block save when any day's macros don't add up to its kcal.
    if(specialty==='nutrition'){
      const bad=collectMacroErrors(div.closest('.plan-table-wrap'));
      if(bad.length){
        status.className='pt-status err';
        status.textContent=`❌ g macros do not correspond to kcal — check ${bad.join(', ')}`;
        return;
      }
    }
    btn.disabled=true; status.className='pt-status'; status.textContent='Saving — AI is perfecting names and generating details…';
    try{
      const days = specialty==='nutrition' ? collectNutrition(div.closest('.plan-table-wrap'),action) : collectTraining(div.closest('.plan-table-wrap'),action);
      const r = await fetch(`${BASE}/api/coach/save-plan-table`,{
        method:'POST',
        headers:{'Content-Type':'application/json', Authorization:`Bearer ${storedToken()}`},
        body: JSON.stringify({specialty, clientId:action.clientId, weekOf:action.weekOf, days}),
      });
      const data=await r.json();
      if(r.ok){
        if(specialty==='nutrition') RECIPE_CACHE=null; // new recipes were just stored
        status.textContent='✅ Plan saved to client portal.'; status.className='pt-status ok';
        btn.textContent='Saved ✓';
        const confirmMsg=`${specialty==='nutrition'?'Nutrition':'Training'} plan saved for ${action.clientName} — week of ${action.weekOf}.`;
        appendMsg('assistant', confirmMsg);
        chatHistory.push({role:'assistant', content: confirmMsg});
      } else {
        status.textContent='❌ '+(data.error||'Failed to save.'); status.className='pt-status err';
        btn.disabled=false;
      }
    }catch(e){
      status.textContent='❌ Connection error.'; status.className='pt-status err'; btn.disabled=false;
    }
  });
  return div;
}

function q(wrap,field,day,extra){
  const sel=extra!==undefined
    ? `[data-field="${field}"][data-day="${day}"][data-${extra[0]}="${extra[1]}"]`
    : `[data-field="${field}"][data-day="${day}"]`;
  return (wrap.querySelector(sel)||{}).value||'';
}

// ── Macro ↔ kcal coherence ────────────────────────────────────
// Protein 4 kcal/g · Carbs 4 kcal/g · Fat 9 kcal/g.
const MACRO_TOL = (kcal)=>Math.max(25, kcal*0.05); // allow ±5% or ±25 kcal

// Live check for one day's totals. Returns true when coherent (or not yet
// fillable). Paints the 4 cells red + shows the message when it doesn't add up.
function validateDayMacros(inputs, warnEl){
  const kcal=parseFloat(inputs.kcal.value)||0;
  const p=parseFloat(inputs.protein.value)||0;
  const c=parseFloat(inputs.carbs.value)||0;
  const f=parseFloat(inputs.fat.value)||0;
  const ready = kcal>0 && (p>0||c>0||f>0);
  if(!ready){ paintMacros(inputs,warnEl,false); return true; }
  const computed=p*4+c*4+f*9;
  const ok=Math.abs(computed-kcal)<=MACRO_TOL(kcal);
  paintMacros(inputs,warnEl,!ok,computed,kcal);
  return ok;
}
function paintMacros(inputs,warnEl,isError,computed,kcal){
  Object.values(inputs).forEach(i=>i.classList.toggle('pt-in-error',!!isError));
  if(isError){
    warnEl.textContent=`g macros do not correspond to kcal — ${Math.round(computed)} kcal from macros vs ${Math.round(kcal)} target`;
    warnEl.style.display='';
  } else {
    warnEl.style.display='none';
  }
}
// Returns the labels of days whose macros don't match kcal (skips empty days).
function collectMacroErrors(wrap){
  const bad=[];
  wrap.querySelectorAll('.pt-day-block').forEach(block=>{
    const get=(field)=>{const el=block.querySelector(`.pt-in[data-type="daily"][data-field="${field}"]`);return el?parseFloat(el.value)||0:0;};
    const kcal=get('kcal'),p=get('protein'),c=get('carbs'),f=get('fat');
    if(!(kcal>0 && (p>0||c>0||f>0))) return; // skip empty days
    if(Math.abs((p*4+c*4+f*9)-kcal)>MACRO_TOL(kcal)) bad.push(block.querySelector('.pt-day-label')?.textContent||'?');
  });
  return bad;
}

function collectNutrition(wrap,action){
  return action.days.map((day,di)=>{
    const meals=[];
    for(let mi=0;mi<5;mi++){
      const dishes=q(wrap,'dishes',di,['meal',mi]);
      if(!dishes) continue;
      meals.push({
        name:MEAL_NAMES[mi], time:MEAL_TIMES[mi], dishes:dishes,
      });
    }
    return {
      label:day.shortLabel, fullDate:day.fullDate,
      kcal:Number(q(wrap,'kcal',di,['type','daily']))||0,
      protein:Number(q(wrap,'protein',di,['type','daily']))||0,
      carbs:Number(q(wrap,'carbs',di,['type','daily']))||0,
      fat:Number(q(wrap,'fat',di,['type','daily']))||0,
      note:q(wrap,'note',di), meals
    };
  });
}

function collectTraining(wrap,action){
  return action.days.map((day,di)=>{
    const type=q(wrap,'type',di)||'rest';
    const exercises=[];
    for(let ei=0;ei<6;ei++){
      const name=q(wrap,'exname',di,['ex',ei]);
      if(name) exercises.push({name, setsReps:q(wrap,'setsreps',di,['ex',ei]), notes:q(wrap,'exnote',di,['ex',ei])});
    }
    return {label:day.shortLabel, fullDate:day.fullDate, type, session:q(wrap,'session',di)||(type==='rest'?'Active Rest':'Training'), note:q(wrap,'note',di), exercises};
  });
}

function showTyping(){
  const t = document.createElement('div');
  t.className = 'msg assistant';
  t.id = 'typing-indicator';
  t.innerHTML = `<div class="msg-avatar">${me?.specialty==='training'?'E':'D'}</div>
    <div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>`;
  messagesEl.appendChild(t);
  scrollBottom();
  return t;
}

async function send(){
  const text = inputEl.value.trim();
  if(!text || !me) return;

  inputEl.value = '';
  inputEl.style.height = 'auto';
  sendEl.disabled = true;

  // Inject selected client context into message
  let contextNote = '';
  if(activeClient) contextNote = ` [Selected client: ${activeClient.name} (id: ${activeClient.id})]`;
  const fullText = text + contextNote;

  appendMsg('user', text);
  chatHistory.push({ role:'user', content: fullText });

  let typing = null;
  try{
    typing = showTyping();
    const r = await fetch(`${BASE}/api/coach/chat`, {
      method:'POST',
      headers:{ 'Content-Type':'application/json', Authorization:`Bearer ${storedToken()}` },
      body: JSON.stringify({ messages: chatHistory }),
    });
    typing.remove();

    if(!r.ok){ appendMsg('assistant','Error connecting to the server.'); return; }
    const data = await r.json();
    const reply = data.reply || '…';

    appendMsg('assistant', reply, data.action);
    chatHistory.push({ role:'assistant', content: reply });
  }catch(err){
    if(typing) typing.remove();
    appendMsg('assistant','Could not connect to the server.');
    chatHistory.pop();
  }finally{
    sendEl.disabled = false;
    inputEl.focus();
  }
}

sendEl.addEventListener('click', send);
inputEl.addEventListener('keydown', e => {
  if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); send(); }
});

// Auto-resize textarea
inputEl.addEventListener('input', () => {
  inputEl.style.height = 'auto';
  inputEl.style.height = Math.min(inputEl.scrollHeight, 160) + 'px';
});

// ── Client Profile Panel ──────────────────────────────────────
let profileClient = null;

async function openProfile(c){
  profileClient = c;
  document.getElementById('pp-av').textContent    = (c.initials||'').slice(0,2);
  document.getElementById('pp-cname').textContent = c.name;
  document.getElementById('pp-csub').textContent  = `${c.goal} · Week ${c.currentWeek} of ${c.totalWeeks}`;
  document.getElementById('pp-dropdown').classList.remove('open');
  document.getElementById('pp-body').innerHTML    = '<div style="text-align:center;padding:3rem;color:var(--muted2);font-size:.8rem">Loading profile…</div>';
  document.getElementById('profile-panel').classList.add('open');

  const token = storedToken();
  const [clientRes, logsRes, checkinsRes] = await Promise.all([
    fetch(`${BASE}/api/coach/clients/${c.id}`,  { headers:{ Authorization:`Bearer ${token}` } }),
    fetch(`${BASE}/api/logs/${c.id}?days=14`,   { headers:{ Authorization:`Bearer ${token}` } }),
    fetch(`${BASE}/api/checkins/${c.id}`,        { headers:{ Authorization:`Bearer ${token}` } }),
  ]);

  const fullClient = clientRes.ok   ? await clientRes.json()   : c;
  const logs       = logsRes.ok     ? await logsRes.json()     : [];
  const checkins   = checkinsRes.ok ? await checkinsRes.json() : [];
  renderProfile(fullClient, logs, checkins);
}

function closeProfile(){
  document.getElementById('profile-panel').classList.remove('open');
  profileClient = null;
}

function renderProfile(client, logs, checkins){
  const body = document.getElementById('pp-body');

  // Build date→logs map
  const logMap = {};
  logs.forEach(l => { logMap[`${l.logDate}-${l.type}`] = l.data; });

  // Last 14 days
  const days = [];
  for(let i=0;i<14;i++){
    const d=new Date(); d.setDate(d.getDate()-i);
    days.push(d.toISOString().split('T')[0]);
  }

  const bmi = (client.weight && client.height)
    ? (client.weight / ((client.height/100)**2)).toFixed(1)
    : null;
  const lastCI = checkins.length ? checkins[checkins.length-1] : null;

  body.innerHTML = '';

  // ── Métricas corporales ──────────────────────────────────────
  const metSec = document.createElement('div');
  metSec.innerHTML = '<div class="pp-sec-label">Body Metrics</div>';
  const metGrid = document.createElement('div'); metGrid.className='pp-metrics';
  [
    { label:'Weight',    val: client.weight  ? `${client.weight}<sup>kg</sup>`  : null },
    { label:'Body Fat',  val: client.bodyFat ? `${client.bodyFat}<sup>%</sup>`  : null },
    { label:'Lean Mass', val: client.lean    ? `${client.lean}<sup>kg</sup>`    : null },
    { label:'BMI',       val: bmi            ? bmi                               : null },
  ].forEach(({label,val})=>{
    const m=document.createElement('div'); m.className='pp-metric';
    m.innerHTML=`<div class="pp-metric-label">${label}</div>
      <div class="pp-metric-val">${val||'<span class="pp-metric-empty">—</span>'}</div>`;
    metGrid.appendChild(m);
  });
  metSec.appendChild(metGrid);
  body.appendChild(metSec);

  // ── Último check-in ──────────────────────────────────────────
  if(lastCI){
    const ciSec = document.createElement('div');
    const ciDate = new Date(lastCI.date+'T12:00:00')
      .toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'});
    ciSec.innerHTML=`<div class="pp-sec-label">Last Check-in · ${ciDate}</div>`;
    const ciRow=document.createElement('div'); ciRow.className='pp-checkin-row';
    [
      {v:lastCI.weight  ?`${lastCI.weight}kg` :null, l:'Weight'},
      {v:lastCI.bodyFat ?`${lastCI.bodyFat}%` :null, l:'Body Fat'},
      {v:lastCI.lean    ?`${lastCI.lean}kg`   :null, l:'Lean Mass'},
    ].filter(x=>x.v).forEach(({v,l})=>{
      const t=document.createElement('div'); t.className='pp-checkin-tile';
      t.innerHTML=`<div class="pp-checkin-val">${v}</div><div class="pp-checkin-lbl">${l}</div>`;
      ciRow.appendChild(t);
    });
    if(lastCI.notes){
      const n=document.createElement('div'); n.className='pp-note-tile';
      n.textContent=`"${lastCI.notes}"`;
      ciRow.appendChild(n);
    }
    ciSec.appendChild(ciRow);
    body.appendChild(ciSec);
  }

  // ── Adherencia 14 días ───────────────────────────────────────
  const adhSec = document.createElement('div');
  const tLogs  = logs.filter(l=>l.type==='training');
  const tDone  = tLogs.filter(l=>l.data&&l.data.done===true).length;
  const nLogs  = logs.filter(l=>l.type==='nutrition');
  const tPct   = Math.round(tDone/14*100);
  const nPct   = Math.round(nLogs.length/14*100);
  const pctColor = p => p>=80?'var(--green)':p>=50?'var(--gold)':'#e08080';
  adhSec.innerHTML=`<div class="pp-sec-label">Adherence · last 14 days</div>
    <div class="pp-adh-wrap">
      <div class="pp-adh-row">
        <span style="font-size:.65rem;color:var(--muted);width:80px;flex-shrink:0">Training</span>
        <div class="pp-adh-track"><div class="pp-adh-fill" style="width:${tPct}%;background:${pctColor(tPct)}"></div></div>
        <div class="pp-adh-label" style="color:${pctColor(tPct)}">${tDone}/14 completed</div>
      </div>
      <div class="pp-adh-row">
        <span style="font-size:.65rem;color:var(--muted);width:80px;flex-shrink:0">Nutrition</span>
        <div class="pp-adh-track"><div class="pp-adh-fill" style="width:${nPct}%;background:${pctColor(nPct)}"></div></div>
        <div class="pp-adh-label" style="color:${pctColor(nPct)}">${nLogs.length}/14 logged</div>
      </div>
    </div>`;
  body.appendChild(adhSec);

  // ── Registros diarios ────────────────────────────────────────
  const logSec  = document.createElement('div');
  logSec.innerHTML='<div class="pp-sec-label">Daily Logs</div>';
  const logGrid = document.createElement('div'); logGrid.className='pp-log-grid';

  const chipFor = (data, label) => {
    if(!data) return `<span class="pp-log-chip pp-log-empty">— ${label}</span>`;
    if(data.done===true) return `<span class="pp-log-chip pp-log-done">✓ ${label}</span>`;
    return `<span class="pp-log-chip pp-log-logged">· ${label}</span>`;
  };

  days.forEach(ds => {
    const tLog = logMap[`${ds}-training`];
    const nLog = logMap[`${ds}-nutrition`];
    if(!tLog && !nLog) return;
    const d = new Date(ds+'T12:00:00');
    const lbl = d.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'});
    const row = document.createElement('div'); row.className='pp-log-day';
    row.innerHTML=`<span class="pp-log-date">${lbl}</span>${chipFor(tLog,'Training')}${chipFor(nLog,'Nutrition')}`;
    logGrid.appendChild(row);
  });

  if(!logGrid.children.length){
    logGrid.innerHTML='<div class="pp-empty">No logs in the last 14 days.</div>';
  }
  logSec.appendChild(logGrid);
  body.appendChild(logSec);
}

document.getElementById('pp-close').addEventListener('click', closeProfile);
document.getElementById('pp-chat-btn').addEventListener('click', ()=>{
  if(!profileClient) return;
  selectClient(profileClient);
  closeProfile();
});

const menuBtn = document.getElementById('pp-menu-btn');
const dropdown = document.getElementById('pp-dropdown');
menuBtn.addEventListener('click', ()=>dropdown.classList.toggle('open'));
document.addEventListener('click', (e)=>{
  if(!e.target.closest('#pp-menu-btn') && !e.target.closest('#pp-dropdown')){
    dropdown.classList.remove('open');
  }
});

document.getElementById('pp-del-from-menu').addEventListener('click', async ()=>{
  if(!profileClient) return;
  const c = profileClient;
  dropdown.classList.remove('open');
  if(!confirm(`Delete ${c.name}? Their account, plans, logs and check-ins will be permanently removed. This cannot be undone.`)) return;
  try{
    const r = await fetch(`${BASE}/api/coach/clients/${c.id}`, {
      method:'DELETE', headers:{ Authorization:`Bearer ${storedToken()}` }
    });
    if(!r.ok){
      const data = await r.json().catch(()=>({}));
      alert('Could not delete: ' + (data.error || r.status));
      return;
    }
    if(activeClient && activeClient.id === c.id){
      activeClient = null;
      document.getElementById('chat-context').classList.remove('visible');
      document.getElementById('chat-input').placeholder = 'Type here…';
    }
    closeProfile();
    await loadClients();
  }catch(e){
    alert('Connection error while deleting.');
  }
});

async function main(){
  const ok = await initAuth();
  if(!ok) return;
  initUI();
  loadClients();
}
main();

})();
</script>
