<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- Background -->
  <rect width="256" height="256" fill="#050507"/>

  <!-- Main text "DARE" with gradient -->
  <defs>
    <linearGradient id="dareGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#c9a24a;stop-opacity:1" />
      <stop offset="60%" style="stop-color:#a6c85e;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- DARE text -->
  <text
    x="128"
    y="156"
    font-family="'Tulpen One', cursive"
    font-size="160"
    font-weight="bold"
    fill="url(#dareGradient)"
    text-anchor="middle"
    dominant-baseline="middle"
    letter-spacing="-2"
  >DARE</text>

  <!-- Accent line for visual interest at small sizes -->
  <rect x="40" y="200" width="176" height="3" fill="#a6c85e" rx="1.5"/>
</svg>
