<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DARE</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tulpen+One&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            width: 100%;
            height: 100%;
            background: #faf7f1;
        }
        .card {
            width: 100vmin;
            height: 100vmin;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #faf7f1;
            background-image:
                radial-gradient(ellipse at 50% 50%, rgba(196,215,160,0.15) 0%, transparent 70%),
                radial-gradient(ellipse at 20% 80%, rgba(200,217,160,0.12) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 20%, rgba(180,200,140,0.12) 0%, transparent 50%);
        }
        .logo {
            font-family: 'Tulpen One', serif;
            font-size: 22vmin;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            background: linear-gradient(135deg, #8ab85a 0%, #b8956a 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1;
            user-select: none;
        }
    </style>
</head>
<body>
    <div class="card">
        <span class="logo">DARE</span>
    </div>
</body>
</html>
